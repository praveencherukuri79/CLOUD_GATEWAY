server:
    port: 8080

spring:
    cloud:
        circuitbreaker:
            resilience4j:
                configs:
                    default:
                        slidingWindowSize: 10
                        minimumNumberOfCalls: 5
                        failureRateThreshold: 50
                        waitDurationInOpenState: 10s
                instances:
                    users-service:
                        baseConfig: default
                    orders-service:
                        baseConfig: default

app:
    internal-jwt:
        issuer: bff-service
        audience: internal-api
        ttl-seconds: 300
        private-key-location: classpath:keys/bff-jwt-private.pem
    config-service:
        base-url: http://localhost:8085
    downstream:
        users: http://localhost:8081
        orders: http://localhost:8082
        notifications: http://localhost:8083
        alerts: http://localhost:8084

logging:
    level:
        com.example.bff: WARN
        org.springframework.security: INFO
        org.springframework.web: INFO
        org.springframework.cloud.gateway.server.mvc: INFO
