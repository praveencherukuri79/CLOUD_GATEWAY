server:
    port: 8080

# Single Resilience4j config (registries used by spring-cloud-circuitbreaker-resilience4j + Gateway).
resilience4j:
    circuitbreaker:
        configs:
            default:
                slidingWindowSize: 10
                minimumNumberOfCalls: 5
                failureRateThreshold: 50
                waitDurationInOpenState: 10s
        instances:
            users-service:
                baseConfig: default
            orders-service:
                baseConfig: default
    timelimiter:
        configs:
            default:
                timeoutDuration: 60s
        instances:
            users-service:
                baseConfig: default
            orders-service:
                baseConfig: default

app:
    internal-jwt:
        issuer: bff-service
        audience: internal-api
        ttl-seconds: 300
        private-key-location: classpath:keys/bff-jwt-private.pem
    config-service:
        base-url: http://localhost:8085
    downstream:
        users: http://localhost:8081
        orders: http://localhost:8082
        notifications: http://localhost:8083
        alerts: http://localhost:8084
    proxy:
        rpm: 200

logging:
    level:
        com.example.bff: WARN
        org.springframework.security: INFO
        org.springframework.web: INFO
        org.springframework.cloud.gateway.server.mvc: INFO
