server:
    port: 8080

app:
    internal-jwt:
        issuer: bff-service
        audience: internal-api
        ttl-seconds: 300
        private-key-store-location: classpath:keys/bff-jwt-keystore.p12
        private-key-store-password: changeit
        private-key-alias: bff-jwt-key
        private-key-password: changeit
    downstream:
        users: http://localhost:8081
        orders: http://localhost:8082
        notifications: http://localhost:8083
        alerts: http://localhost:8084

logging:
    level:
        com.example.bff: WARN
        org.springframework.security: INFO
        org.springframework.web: INFO
        org.springframework.cloud.gateway.server.mvc: INFO
